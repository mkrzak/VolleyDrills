<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VolleyDrills</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: a library of drill cards; each card opens its own drill page with an animated court */
:root{
  --bg:#eef2f4; --paper:#ffffff; --fg:#1d2733; --muted:#5a6878; --rule:#d5dde4;
  --free:#2f6f8f; --court:#e8894a; --opp:#d97a3f; --line:#ffffff;
  --setter:#f3c623; --player:#1f3a5c; --libero:#2a9d6f; --rival:#9b2c2c; --coach:#ffffff; --ink:#1d2733;
  --move:#14324f; --ball:#1d2733; --hoop:#ffffff; --accent:#c4571c; --zone:rgba(255,255,255,.22);
  --head:#16283c;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Source Sans 3",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121821; --paper:#1a222d; --fg:#e7edf2; --muted:#9aa8b6; --rule:#2c3744;
  --free:#1f4d64; --court:#b8652f; --opp:#a35a2a; --line:#f3efe9; --player:#0f2540; --libero:#1f7d58; --rival:#7d2222;
  --move:#0b1a2b; --ball:#0b1a2b; --accent:#f0a06a; --zone:rgba(255,255,255,.16); --head:#0c1622; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121821; --paper:#1a222d; --fg:#e7edf2; --muted:#9aa8b6; --rule:#2c3744;
  --free:#1f4d64; --court:#b8652f; --opp:#a35a2a; --line:#f3efe9; --player:#0f2540; --libero:#1f7d58; --rival:#7d2222;
  --move:#0b1a2b; --ball:#0b1a2b; --accent:#f0a06a; --zone:rgba(255,255,255,.16); --head:#0c1622; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16.5px/1.5 var(--body)}
.band{background:var(--head);color:#fff;border-bottom:5px solid #f0a500}
.in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band .in{padding-block:26px 20px}
h1{font:700 clamp(36px,6vw,56px)/1 var(--display);letter-spacing:.5px;margin:0;text-transform:uppercase}
h1 a{color:inherit;text-decoration:none}
.band p{margin:8px 0 0;color:#b9cde0;max-width:64ch}
main .in{padding-block:22px 48px;display:grid;gap:18px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{font:600 15px var(--body);color:var(--fg);border:1px solid var(--rule);background:var(--paper);padding:6px 14px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--paper);border-color:var(--fg)}
.filters button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;display:flex;flex-direction:column;transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 26px -16px rgba(20,40,60,.5)}
.thumb{aspect-ratio:10/8;background:var(--free);overflow:hidden}
.thumb svg{width:100%;height:100%;display:block}
.cbody{padding:12px 14px 14px;display:grid;gap:4px;flex:1;align-content:start}
.tag{justify-self:start;font:700 12px var(--body);letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.card h2{font:700 24px/1.05 var(--display);margin:0;text-transform:uppercase;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:15px}
.card .foot{margin-top:auto;padding-top:6px;font:600 13.5px var(--body);color:var(--muted)}
.back{font:600 15px var(--body);color:var(--accent);text-decoration:none;justify-self:start}
.detail{background:var(--paper);border:1px solid var(--rule);border-radius:14px;display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:26px;padding:20px}
@media (max-width:820px){.detail{grid-template-columns:1fr}}
.detail svg.court{width:100%;height:auto;display:block;border-radius:10px;cursor:pointer}
.hint{font-size:13.5px;color:var(--muted);margin-top:6px;text-align:center}
.detail h2{font:700 40px/1 var(--display);margin:4px 0 6px;text-transform:uppercase;text-wrap:balance}
.meta{font:600 13px var(--body);letter-spacing:1.2px;text-transform:uppercase;color:var(--accent)}
.aim{color:var(--muted);margin:0 0 6px}
.detail ol{margin:0;padding-left:20px}.detail li{margin:3px 0}
.line{margin:10px 0 0;font-size:15.5px}.line b{font:700 12.5px var(--body);letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-right:6px}
.rule{margin:10px 0 0;font-size:15px;padding:8px 12px;border-left:3px solid var(--libero);background:color-mix(in srgb,var(--libero) 10%,transparent)}
.rule b{font:700 12.5px var(--body);letter-spacing:1px;text-transform:uppercase;margin-right:6px}
.chips{list-style:none;padding:0!important;margin:12px 0 0!important;display:flex;flex-wrap:wrap;gap:6px}
.chips li{margin:0;font:600 14px var(--body);padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.plab{font:700 12.5px var(--body);letter-spacing:1px;text-transform:uppercase;color:var(--muted);align-self:center;margin-right:4px}
.players{margin-top:12px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--free) 10%,transparent);font-size:15px}
.players>b{font:700 12.5px var(--body);letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-right:6px}
.players p{margin:4px 0 0}.players span{font-weight:700;margin-right:4px}
.next{border-top:1px solid var(--rule);padding-top:10px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pager a{font:600 15px var(--body);color:var(--fg);text-decoration:none;border:1px solid var(--rule);background:var(--paper);padding:8px 14px;border-radius:10px;max-width:48%}
.pager a:hover{border-color:var(--accent);color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
footer{color:var(--muted);font-size:15px}footer a{color:var(--accent)}
svg text{font-family:var(--body);font-weight:700}
@media (prefers-reduced-motion:reduce){.card,.card:hover{transition:none;transform:none}}
</style>
</head>

D.forEach(d=>{const p=PL[d.id]||[2,"",""];d.min=p[0];d.few=p[1];d.more=p[2]});

const NS="http://www.w3.org/2000/svg",U=34,OX=24,RM=matchMedia("(prefers-reduced-motion: reduce)").matches;

let uid=0;
function draw(svg,s,thumb){

    else{el("line",{x1:px(0),y1:py(-top)-3,x2:px(0),y2:py(0),stroke:"var(--line)","stroke-width":3},svg);el("line",{x1:px(9),y1:py(-top)-3,x2:px(9),y2:py(0),stroke:"var(--line)","stroke-width":3},svg)}

    const o=el("text",{x:px(8.85),y:py(-top)+14,"text-anchor":"end","font-size":11,fill:"var(--line)",opacity:.9},svg);o.textContent="OTHER SIDE"}
  el("rect",{x:px(0),y:py(0),width:9*U,height:9*U,fill:"var(--court)",stroke:"var(--line)","stroke-width":3},svg);
  el("line",{x1:px(0),y1:py(3),x2:px(9),y2:py(3),stroke:"var(--line)","stroke-width":2.5},svg);

  el("line",{x1:px(-.5),y1:py(0),x2:px(9.5),y2:py(0),stroke:"var(--ink)","stroke-width":6},svg);
  el("line",{x1:px(-.5),y1:py(0),x2:px(9.5),y2:py(0),stroke:"var(--line)","stroke-width":2,"stroke-dasharray":"3 3"},svg);
  const nt=el("text",{x:px(9.45),y:py(0)+16,"text-anchor":"end","font-size":11,fill:"var(--line)"},svg);nt.textContent="NET";
  (s.ghost||[]).forEach(([x,y])=>el("circle",{cx:px(x),cy:py(y),r:9,fill:"none",stroke:"var(--line)","stroke-width":2,"stroke-dasharray":"3 3",opacity:.85},svg));
  (s.hoops||[]).forEach(h=>{el("circle",{cx:px(h.x),cy:py(h.y),r:15,fill:"none",stroke:"var(--hoop)","stroke-width":4},svg);
    el("circle",{cx:px(h.x),cy:py(h.y),r:15,fill:"none",stroke:"var(--ink)","stroke-width":1,"stroke-dasharray":"2 3"},svg);
    if(h.l&&!thumb)lab(svg,px(h.x)+(h.dx||0),py(h.y)+(h.dy??30),h.l)});

    el("line",{...a,stroke:"var(--line)","stroke-width":5,"stroke-linecap":"round"},svg);
    R.m.push(el("line",{...a,stroke:"var(--move)","stroke-width":2.6,"marker-end":`url(#m${id})`},svg))});
  (s.balls||[]).forEach(([x1,y1,x2,y2,c=0.25,o=1])=>{const X1=px(x1),Y1=py(y1),X2=px(x2),Y2=py(y2),dx=X2-X1,dy=Y2-Y1;

  (s.people||[]).forEach(p=>{const X=px(p.x),Y=py(p.y),k=p.k||"P",lb=p.l||k;

let RUN=0;
function anim(R){
  if(RM||!R.seq)return;
  const svg=R.svg,all=[...R.b,...R.m];
  const ball=el("g",{opacity:0},svg);
  el("circle",{r:7.5,fill:"#ffffff",stroke:"#1d2733","stroke-width":2},ball);
  el("path",{d:"M-7 0Q0 -4 7 0M-3.5 -6.5Q-1 0 -3.5 6.5M3.5 -6.5Q1 0 3.5 6.5",fill:"none",stroke:"#1d2733","stroke-width":1.2},ball);
  const movers=R.m.map(()=>el("circle",{r:12,fill:"rgba(255,255,255,.35)",stroke:"#ffffff","stroke-width":3,opacity:0},svg));
  const pe0=items=>items.every(([pe])=>pe.isConnected);
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const tween=(items,dur)=>new Promise(res=>{const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    if(!pe0(items))return res();items.forEach(([pe,n])=>{const p=pe.getPointAtLength(pe.getTotalLength()*e);n.setAttribute("transform",`translate(${p.x} ${p.y})`)});k<1?requestAnimationFrame(f):res()})(t0)});

    while(my===RUN&&document.body.contains(svg)){
      for(const step of R.seq){if(my!==RUN)break;
        const items=step.map(c=>{const i=+c.slice(1);return c[0]==="b"?[R.b[i],ball]:[R.m[i],movers[i]]});
        all.forEach(e=>e.style.opacity=.3);items.forEach(([pe,n])=>{pe.style.opacity=1;n.setAttribute("opacity",1)});
        ball.setAttribute("opacity",items.some(([,n])=>n===ball)?1:0);
        if(!document.body.contains(svg))return;
        await tween(items,items.some(([,n])=>n===ball)?1000:800);await wait(200);movers.forEach(m=>m.setAttribute("opacity",0))}

const app=document.getElementById("app");let filter="Setting",players=0;
